<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Post Search API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        button {
            background: #8310FF;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #6B0BC7;
        }
        pre {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
        .success {
            color: green;
        }
        .error {
            color: red;
        }
        input, select {
            padding: 8px;
            margin: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>🧪 Post Search API Tester</h1>
    <p>Test the <code>/post/search</code> API endpoint (No authentication required)</p>

    <div class="test-section">
        <h2>Quick Tests</h2>
        <button onclick="testBasicSearch()">Test Basic Search</button>
        <button onclick="testWithSearch()">Test with Search Query</button>
        <button onclick="testWithFilters()">Test with Filters</button>
        <button onclick="testPagination()">Test Pagination</button>
    </div>

    <div class="test-section">
        <h2>Custom Test</h2>
        <div>
            <input type="text" id="searchInput" placeholder="Search query" />
            <input type="text" id="locationInput" placeholder="Location" />
            <select id="statusSelect">
                <option value="active">Active</option>
                <option value="">All</option>
            </select>
            <input type="number" id="pageInput" placeholder="Page" value="1" min="1" />
            <input type="number" id="limitInput" placeholder="Limit" value="6" min="1" />
            <button onclick="testCustom()">Run Custom Test</button>
        </div>
    </div>

    <div class="test-section">
        <h2>Results</h2>
        <div id="status"></div>
        <div id="results"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000';

        async function makeRequest(endpoint, params = {}) {
            const statusDiv = document.getElementById('status');
            const resultsDiv = document.getElementById('results');
            
            statusDiv.innerHTML = '<p>⏳ Loading...</p>';
            resultsDiv.innerHTML = '';

            try {
                const queryString = new URLSearchParams(params).toString();
                const url = `${API_BASE}${endpoint}${queryString ? '?' + queryString : ''}`;
                
                statusDiv.innerHTML += `<p>📡 Request URL: <code>${url}</code></p>`;
                
                const response = await fetch(url);
                
                statusDiv.innerHTML += `<p>Status Code: <strong class="${response.ok ? 'success' : 'error'}">${response.status}</strong></p>`;
                
                const data = await response.json();
                
                if (data.success) {
                    statusDiv.innerHTML += `<p class="success">✅ Success! Found ${data.total} jobs</p>`;
                    statusDiv.innerHTML += `<p>Page ${data.page} of ${data.totalPages}</p>`;
                    
                    resultsDiv.innerHTML = `<h3>Response Data:</h3><pre>${JSON.stringify(data, null, 2)}</pre>`;
                    
                    if (data.results && data.results.length > 0) {
                        resultsDiv.innerHTML += '<h3>Jobs:</h3>';
                        data.results.forEach(job => {
                            resultsDiv.innerHTML += `
                                <div style="border-left: 3px solid #8310FF; padding: 10px; margin: 10px 0; background: #f9f9f9;">
                                    <h4>${job.jobDetails?.title || 'No title'}</h4>
                                    <p><strong>Company:</strong> ${job.user?.companyDetails?.companyName || 'N/A'}</p>
                                    <p><strong>Location:</strong> ${job.jobDetails?.location || 'N/A'}</p>
                                    <p><strong>Type:</strong> ${job.jobDetails?.workType || job.jobDetails?.type || 'N/A'}</p>
                                    <p><strong>Employment:</strong> ${job.jobDetails?.employmentType || 'N/A'}</p>
                                    <p><strong>Status:</strong> ${job.status}</p>
                                </div>
                            `;
                        });
                    }
                } else {
                    statusDiv.innerHTML += `<p class="error">❌ Error: ${data.error || data.message || 'Unknown error'}</p>`;
                    resultsDiv.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                }
                
            } catch (error) {
                statusDiv.innerHTML += `<p class="error">❌ Request failed: ${error.message}</p>`;
                resultsDiv.innerHTML = `<pre>${error.stack}</pre>`;
            }
        }

        function testBasicSearch() {
            makeRequest('/post/search', { status: 'active', limit: 6 });
        }

        function testWithSearch() {
            makeRequest('/post/search', { 
                status: 'active', 
                search: 'developer',
                limit: 6 
            });
        }

        function testWithFilters() {
            makeRequest('/post/search', { 
                status: 'active',
                location: 'San Francisco',
                type: 'Remote',
                limit: 6
            });
        }

        function testPagination() {
            makeRequest('/post/search', { 
                status: 'active',
                page: 2,
                limit: 3
            });
        }

        function testCustom() {
            const params = {
                status: document.getElementById('statusSelect').value,
                page: document.getElementById('pageInput').value,
                limit: document.getElementById('limitInput').value
            };

            const search = document.getElementById('searchInput').value;
            const location = document.getElementById('locationInput').value;

            if (search) params.search = search;
            if (location) params.location = location;

            makeRequest('/post/search', params);
        }

        // Run basic test on load
        window.onload = () => {
            console.log('🚀 API Tester loaded. Click a button to test the API.');
        };
    </script>
</body>
</html>
